name: encontrarnos

# Toda la pila: app, cola, programador, MySQL, Meilisearch y CompreFace.
# Los datos viven en volúmenes con nombre dentro del disco de Docker Desktop;
# mueve ese disco a D: (ver README, sección Docker) y ocuparán espacio allí.
include:
  - compose.compreface.yaml

x-app: &app
  image: encontrarnos-app:latest
  build: .
  env_file: .env.docker
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    meilisearch:
      condition: service_started
  volumes:
    - app-storage:/var/www/html/storage/app
    # Fotografías de las fichas (xx/<sha256>.jpg), antes en D:/ProyectoDesaparecidos_datos/imagenes.
    - record-photos:/var/www/html/storage/app/private/record-photos

services:
  app:
    <<: *app
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://127.0.0.1:8080/up || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Migra al arrancar (una sola réplica) y deja cachés de configuración listas.
    entrypoint: ['sh', '-c', 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && exec docker-php-serversideup-entrypoint /init']

  queue:
    <<: *app
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ['php', 'artisan', 'schedule:work']
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-encontrarnos}
      MYSQL_USER: ${DB_USERNAME:-encontrarnos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    command: ['--innodb-buffer-pool-size=1G', '--character-set-server=utf8mb4', '--max-allowed-packet=256M']
    ports:
      # Solo local: para herramientas de escritorio y el volcado de la base del colector.
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.14
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?Define MEILISEARCH_KEY en .env}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili-data:/meili_data

volumes:
  app-storage:
  mysql-data:
  meili-data:
  record-photos:
